<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://esm.sh; style-src 'self' 'unsafe-inline'; img-src 'self' https://ovvubbwzxikqcnuvvtjb.supabase.co data: blob:; font-src 'self' data:; connect-src 'self' https://ovvubbwzxikqcnuvvtjb.supabase.co wss://ovvubbwzxikqcnuvvtjb.supabase.co https://esm.sh https://formspree.io ws://localhost:* ws://127.0.0.1:*; form-action 'self' https://formspree.io; frame-src 'none'; worker-src 'self' blob:">
    <script src="../js/error-monitor.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#101724">
    <meta name="description" content="Публичный профиль автора модов WT Mod Manager.">
    <title>Профиль автора — WT Mod Manager</title>
    <link rel="icon" href="../assets/LogotipProject.png" type="image/png">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../mods/mods.css">
    <link rel="stylesheet" href="../community2.css">
    <link rel="preconnect" href="https://esm.sh" crossorigin>
    <script type="module" src="creator.js"></script>
</head>
<body>
    <header class="site-header">
        <nav class="nav wrap">
            <a class="brand" href="../index.html">
                <img src="../assets/LogotipProject.png" width="42" height="42" alt="">
                <span>WT <strong>MOD MANAGER</strong></span>
            </a>
            <div class="mods-header-links">
                <a href="../index.html">Главная</a>
                <a href="../mods/mods.html">Библиотека модов</a>
                <a href="../profile/profile.html">Мой профиль</a>
            </div>
        </nav>
    </header>
    <main class="wrap mods-page">
        <div class="mods-hero">
            <div>
                <span class="mods-kicker">WTMM / CREATOR</span>
                <h1>Профиль автора</h1>
                <p>Публичная страница игрока и его одобренные модификации.</p>
            </div>
        </div>
        <p id="creatorNotice" role="status" aria-live="polite">Загрузка...</p>
        <section class="creator-header" id="creatorHeader" hidden>
            <div class="creator-banner" id="creatorBanner">
                <img id="creatorBannerImage" alt="Баннер автора" hidden>
                <span id="creatorBannerFallback">WT MOD MANAGER</span>
            </div>
            <div class="creator-info">
                <div class="creator-avatar" id="creatorAvatar">
                    <img id="creatorAvatarImage" alt="Аватар автора" hidden>
                    <span id="creatorAvatarFallback">WT</span>
                </div>
                <div>
                    <h2 class="creator-name" id="creatorName">Автор</h2>
                    <p class="creator-bio" id="creatorBio"></p>
                    <span id="creatorModCount" class="mods-count"></span>
                    <div class="community2-actions">
                      <button id="followCreatorButton" type="button" class="community2-button" hidden aria-pressed="false">Подписаться на автора</button>
                      <span id="creatorFollowNotice" role="status" aria-live="polite" class="community2-muted"></span>
                    </div>
                </div>
            </div>
        </section>
        <h2 id="creatorModsHeading" hidden>Модификации автора</h2>
        <div id="creatorModsGrid" class="mods-grid"></div>
    </main>
</body>
</html>
