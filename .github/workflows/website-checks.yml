name: Website security and regression checks
on:
  push:
    branches: [main, hardening-comprehensive-2026-11-17]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JS, HTML, file references and ZIP checks
        run: node tools/check-site.mjs
