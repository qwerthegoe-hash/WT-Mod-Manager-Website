name: Website security and regression checks
on:
  push:
    branches: [main, hardening-comprehensive-2026-11-17]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JS, HTML, file references and ZIP checks
        run: node tools/check-site.mjs
      - name: Check full handoff TXT against actual project source paths
        run: node tools/test-project-handoff.mjs
      - name: Run Python archive-scanner safety regression tests
        run: python3 -m unittest discover -s tools -p "test_scan_mod_packages.py" -v
      - name: Validate scanner Python syntax
        run: python3 -m py_compile tools/scan_mod_packages.py
      - name: Verify optional Windows sync script syntax (without executing it)
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path tools/windows-sync/sync-github-safe.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path tools/windows-sync/setup-windows-sync.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path tools/verify-release-checksum.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Test release SHA-256 verifier with valid and tampered files
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP "wtmm-checksum-fixture"
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          $asset = Join-Path $folder "fixture.zip"
          $manifest = Join-Path $folder "SHA256SUMS.txt"
          [IO.File]::WriteAllText($asset, "benign test fixture")
          $digest = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText($manifest, "$digest  fixture.zip" + [Environment]::NewLine)
          & ./tools/verify-release-checksum.ps1 -Asset $asset -Manifest $manifest
          [IO.File]::AppendAllText($asset, "tampered")
          $caught = $false
          try { & ./tools/verify-release-checksum.ps1 -Asset $asset -Manifest $manifest | Out-Null }
          catch { $caught = $true }
          if (-not $caught) { throw "Tampered release file unexpectedly passed" }
      - name: Set up Deno for server-function validation
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase server function
        run: deno check --config docs/supabase/functions/community-media/deno.json docs/supabase/functions/community-media/index.ts
      - name: Type-check authenticated contact gateway
        run: deno check docs/supabase/functions/contact-message/index.ts
      - name: Type-check desktop bridge
        run: deno check docs/supabase/functions/wtmm-desktop-bridge/index.ts
      - name: Type-check VT Edge gateway
        run: deno check supabase/functions/wtmm-vt-lookup/index.ts
      - name: Type-check sequential ZIP queue scanner
        run: deno check supabase/functions/wtmm-mod-scan/index.ts
      - name: Test ZIP scanner without network or secrets
        run: deno test supabase/functions/wtmm-mod-scan/zip_test.ts
