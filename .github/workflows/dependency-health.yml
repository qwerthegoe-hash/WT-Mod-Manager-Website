name: Weekly Python dependency vulnerability audit
on:
  pull_request:
    paths:
      - "requirements-build.txt"
      - ".github/workflows/dependency-health.yml"
  push:
    branches: [main]
    paths:
      - "requirements-build.txt"
      - ".github/workflows/dependency-health.yml"
  schedule:
    - cron: "35 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-security:
    name: Audit pinned Windows build dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyPA's vulnerability scanner
        run: python -m pip install "pip-audit>=2.9,<4"
      - name: Audit requirements against published advisories
        run: python -m pip_audit -r requirements-build.txt --strict --progress-spinner off
