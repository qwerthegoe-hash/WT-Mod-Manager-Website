name: Build WT Mod Manager Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "ui/**"
      - "assets/**"
      - "config/**"
      - "requirements-build.txt"
      - "tools/build_windows_exe.py"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: write

jobs:
  windows:
    name: One-file Windows executable
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Check Python source
        run: |
          python -m compileall -q src ui
          python -c "import src.main; import ui.main_window; print('Python and Qt imports OK')"

      - name: Build EXE
        run: python tools/build_windows_exe.py

      - name: SHA256 of executable
        shell: pwsh
        run: Get-FileHash -Algorithm SHA256 dist/WTModManager.exe | Format-List

      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: WTModManager-Windows-${{ github.run_number }}
          path: dist/WTModManager.exe
          if-no-files-found: error
          retention-days: 14

      - name: Create checksum manifest
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 dist/WTModManager.exe).Hash.ToLowerInvariant()
          "$hash  WTModManager.exe" | Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii

      - name: Publish Windows 1.3 test beta after successful build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.3.0-beta.2'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release $tag already exists; no overwrite."
            exit 0
          }

          @'
          WT Mod Manager 1.3 - Test Beta (Windows x64)

          Portable one-file Windows build with optional account-linked
          online downloads, per-account mod sets, improved audio preview,
          backup/restore controls and opt-in verified EXE updating.

          TEST BETA: automated source/unit/UI checks are required, but account
          transfer, game integration and the Windows self-replacement process
          have not been verified on a real user's system. Keep backups and
          test this build before making it the official website download.

          Your settings and personal mod files remain in your Windows user
          profile. Verify file integrity using SHA256SUMS.txt.

          Independent fan project; not affiliated with Gaijin Entertainment.
          '@ | Set-Content -Path release-notes.md -Encoding utf8

          gh release create $tag dist/WTModManager.exe dist/SHA256SUMS.txt `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title 'WT Mod Manager 1.3 - Windows Test Beta' `
            --notes-file release-notes.md `
            --prerelease `
            --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish Windows beta release.' }
          gh release view $tag --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Failed to verify Windows beta release.' }
