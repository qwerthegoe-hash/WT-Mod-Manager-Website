name: Build WT Mod Manager Windows Installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "ui/**"
      - "assets/**"
      - "config/**"
      - "installer/**"
      - "tools/build_windows_exe.py"
      - "tools/build_installer_assets.py"
      - "tools/sign_windows_release.ps1"
      - "tools/release_integrity.py"
      - "tools/build_sbom.py"
      - "tests/test_release_integrity.py"
      - "tests/test_build_sbom.py"
      - "requirements-build.txt"
      - ".github/workflows/build-windows-exe.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "ui/**"
      - "assets/**"
      - "config/**"
      - "installer/**"
      - "tools/build_windows_exe.py"
      - "tools/build_installer_assets.py"
      - "tools/sign_windows_release.ps1"
      - "tools/release_integrity.py"
      - "tools/build_sbom.py"
      - "tests/test_release_integrity.py"
      - "tests/test_build_sbom.py"
      - "requirements-build.txt"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

# Main release workflows are not cancelled mid-publish. PR checks supersede older ones.
concurrency:
  group: wtmm-windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: Installer + portable Windows x64
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    timeout-minutes: 55
    env:
      WTMM_VERSION: 1.3.0-beta.11
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Check Python source and Qt imports
        run: |
          python -m compileall -q src ui tools tests
          python -c "import src.main; import ui.main_window; print('Python and Qt imports OK')"

      - name: Fail if app, installer, workflow or release notes disagree on version
        shell: pwsh
        run: python tools/release_integrity.py version --expected-version $env:WTMM_VERSION

      - name: Test release hashing and manifest tamper detection
        run: python -m unittest discover -s tests -p "test_release_integrity.py" -v

      - name: Test build SBOM privacy and package consistency
        run: python -m unittest discover -s tests -p "test_build_sbom.py" -v

      - name: Test new Downloads UI and non-network mod security checks
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -p "test_mod_security.py" -v
          python -m unittest discover -s tests -p "test_vt_backend.py" -v
          python -m unittest discover -s tests -p "test_gui_smoke.py" -v

      - name: Validate optional signing script syntax (no secrets)
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          $path = (Resolve-Path 'tools/sign_windows_release.ps1').Path
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Output
            throw "Invalid signing script syntax"
          }

      - name: Compile official Windows taskbar helper
        shell: pwsh
        run: |
          cmake -S tools/taskbar -B build/taskbar -A x64
          if ($LASTEXITCODE -ne 0) { throw "Taskbar helper configuration failed" }
          cmake --build build/taskbar --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Taskbar helper compilation failed" }
          $dll = "build/taskbar/Release/wtmm_taskbar.dll"
          if (-not (Test-Path $dll)) { throw "Native TaskbarManager DLL missing" }
          Copy-Item $dll build/wtmm_taskbar.dll -Force

      - name: Sign taskbar DLL before EXE packaging (trusted main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          WTMM_SIGN_PFX_BASE64: ${{ secrets.WTMM_SIGN_PFX_BASE64 }}
          WTMM_SIGN_PFX_PASSWORD: ${{ secrets.WTMM_SIGN_PFX_PASSWORD }}
        run: .\tools\sign_windows_release.ps1 -Stage native

      - name: Build portable and installed application
        run: python tools/build_windows_exe.py

      - name: Sign desktop EXEs when owner cert is configured
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          WTMM_SIGN_PFX_BASE64: ${{ secrets.WTMM_SIGN_PFX_BASE64 }}
          WTMM_SIGN_PFX_PASSWORD: ${{ secrets.WTMM_SIGN_PFX_PASSWORD }}
        run: .\tools\sign_windows_release.ps1 -Stage payload

      - name: Generate branded wizard art from official logo
        run: python tools/build_installer_assets.py

      - name: Test installer graphics, upgrade compatibility and safe uninstall
        run: python -m unittest discover -s tests -p "test_installer_*.py" -v

      - name: Install Inno Setup 6.7.1
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --version=6.7.1 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup install failed" }
          }
          if (-not (Test-Path $compiler)) { throw "Missing Inno Setup compiler" }

      - name: Compile custom dark installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $compiler "/DMyAppVersion=$env:WTMM_VERSION" "installer\WTModManager.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
          if (-not (Test-Path "dist\WTModManager-Setup.exe")) { throw "Setup EXE missing" }
          if ((Get-Item "dist\WTModManager-Setup.exe").Length -lt 1048576) { throw "Installer unexpectedly small" }

      - name: Sign installer when owner cert is configured
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          WTMM_SIGN_PFX_BASE64: ${{ secrets.WTMM_SIGN_PFX_BASE64 }}
          WTMM_SIGN_PFX_PASSWORD: ${{ secrets.WTMM_SIGN_PFX_PASSWORD }}
        run: .\tools\sign_windows_release.ps1 -Stage installer

      - name: Windows smoke test install, run and uninstall
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $target = Join-Path $env:RUNNER_TEMP "WTMM-Installer-Smoke"
          $setup = (Resolve-Path "dist\WTModManager-Setup.exe").Path
          $args = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR="' + $target + '"'
          $p = Start-Process -FilePath $setup -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Silent installation failed" }
          if (-not (Test-Path "$target\WTModManager.exe")) { throw "Installed EXE missing" }
          if ((Get-Item "$target\WTModManager.exe").Length -lt 1048576) { throw "Single-file app unexpectedly small" }
          if (Test-Path "$target\_internal") { throw "Old unprotected _internal payload should not exist" }
          if (Test-Path "$target\assets") { throw "Assets must be embedded in EXE" }
          if (Test-Path "$target\config") { throw "Public config must be embedded in EXE" }
          if (-not (Test-Path "$target\wtmm.installed")) { throw "Installed marker missing" }
          # Simulate a beta.8 onedir installation being upgraded in place.
          $oldRuntime = Join-Path $target "_internal"
          New-Item -ItemType Directory -Path $oldRuntime -Force | Out-Null
          Set-Content (Join-Path $oldRuntime "old-runtime.txt") "generated old runtime"
          $upgrade = Start-Process -FilePath $setup -ArgumentList $args -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "In-place upgrade failed" }
          if (Test-Path $oldRuntime) { throw "Legacy runtime directory not cleaned on upgrade" }
          if (-not (Test-Path "$target\WTModManager.exe")) { throw "Onefile app missing after upgrade" }
          $uninstaller = (Get-ChildItem "$target\unins*.exe" | Select-Object -First 1).FullName
          if (-not $uninstaller) { throw "Windows uninstaller missing" }
          $app = Start-Process -FilePath "$target\WTModManager.exe" -ArgumentList "--updated" -PassThru
          try {
            Start-Sleep -Seconds 8
            $app.Refresh()
            if ($app.HasExited) { throw "Installed GUI closed unexpectedly" }
          }
          finally {
            taskkill.exe /PID $app.Id /T /F 2>$null | Out-Null
          }
          $u = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Uninstaller failed" }
          if (Test-Path "$target\WTModManager.exe") { throw "Program not removed after uninstall" }
          Write-Output "Installed app, launched GUI and uninstalled successfully"

      - name: Verify EXE signatures and generate release evidence
        shell: pwsh
        run: |
          $files = @("dist\WTModManager.exe", "dist\WTModManager-Setup.exe")
          $signatures = @($files | ForEach-Object { Get-AuthenticodeSignature -FilePath $_ })
          $valid = @($signatures | Where-Object { $_.Status -eq 'Valid' })
          if ($valid.Count -ne 0 -and $valid.Count -ne 2) {
            throw "Inconsistent Authenticode signing: both EXEs must be validly signed or both unsigned"
          }
          $signed = if ($valid.Count -eq 2) { "true" } else { "false" }
          $publisher = ""
          if ($signed -eq "true") {
            $subjects = @($valid | ForEach-Object { $_.SignerCertificate.Subject } | Select-Object -Unique)
            if ($subjects.Count -ne 1) { throw "Executable publisher identities disagree" }
            $publisher = $subjects[0]
          } else {
            $unsupported = @($signatures | Where-Object { $_.Status -ne 'NotSigned' })
            if ($unsupported.Count -gt 0) { throw "An EXE has an invalid or untrusted signature" }
            Write-Warning "This test beta is unsigned. Windows SmartScreen may show a warning."
          }
          python tools/release_integrity.py create --expected-version "$env:WTMM_VERSION" --repository "$env:GITHUB_REPOSITORY" --commit "$env:GITHUB_SHA" --run-url "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" --signed $signed --publisher "$publisher"
          if ($LASTEXITCODE -ne 0) { throw "Release manifest generation failed" }
          python tools/release_integrity.py verify --expected-version "$env:WTMM_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "Release hash verification failed" }

      - name: Generate and validate public software bill of materials
        run: |
          python tools/build_sbom.py create --output dist/sbom.cdx.json
          python tools/build_sbom.py verify --output dist/sbom.cdx.json

      - name: Attest Windows release provenance via GitHub and Sigstore
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/WTModManager.exe
            dist/WTModManager-Setup.exe
            dist/SHA256SUMS.txt
            dist/build-info.json
            dist/sbom.cdx.json

      - name: Verify build provenance attestation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify dist/WTModManager.exe --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "Portable build provenance could not be verified" }
          gh attestation verify dist/WTModManager-Setup.exe --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "Installer build provenance could not be verified" }

      - name: Upload Windows setup and portable compatibility copy
        uses: actions/upload-artifact@v4
        with:
          name: WTModManager-Windows-${{ github.run_number }}
          path: |
            dist/WTModManager-Setup.exe
            dist/WTModManager.exe
            dist/SHA256SUMS.txt
            dist/build-info.json
            dist/sbom.cdx.json
          if-no-files-found: error
          retention-days: 14


  publish:
    name: Publish verified immutable GitHub prerelease
    needs: [windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: read
    env:
      WTMM_VERSION: 1.3.0-beta.11
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Python 3.12 for release verification
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Obtain Windows binaries from successful tested build
        uses: actions/download-artifact@v4
        with:
          name: WTModManager-Windows-${{ github.run_number }}
          path: dist

      - name: Reverify public provenance before publishing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/release_integrity.py verify --expected-version "$env:WTMM_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "Downloaded release artifacts are invalid" }
          python tools/build_sbom.py verify --output dist/sbom.cdx.json
          if ($LASTEXITCODE -ne 0) { throw "Release SBOM is missing or invalid" }
          gh attestation verify dist/WTModManager.exe --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "Missing portable provenance attestation" }
          gh attestation verify dist/WTModManager-Setup.exe --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "Missing installer provenance attestation" }

      - name: Publish immutable prerelease from main after all checks
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:WTMM_VERSION"
          python tools/release_integrity.py verify --expected-version "$env:WTMM_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "Release bits changed after attestation" }

          $prior = gh release view $tag --repo $env:GITHUB_REPOSITORY --json targetCommitish --jq '.targetCommitish' 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Warning "Release $tag already exists at $prior; it is immutable and will not be overwritten. Bump the version for a new public build."
            exit 0
          }

          $info = Get-Content "dist\build-info.json" -Encoding utf8 -Raw | ConvertFrom-Json
          if ($info.commit -ne $env:GITHUB_SHA) { throw "Release artifact source commit mismatch" }
          $notes = Get-Content "installer\release-notes.txt" -Encoding utf8 -Raw
          $status = if ($info.authenticode.signed) {
            "Authenticode signed by " + $info.authenticode.publisher
          } else {
            "Unsigned: requires a real publisher code-signing certificate; SmartScreen warnings are possible."
          }
          $notes += "`n`n---`nBuild: $($info.build_url)`nSource commit: $($info.commit)`nSignature: $status`n"
          $notes += "Verify downloads using SHA256SUMS.txt or the GitHub build provenance attestation.`n"
          $notes | Set-Content "release-notes.md" -Encoding utf8
          gh release create $tag dist/WTModManager-Setup.exe dist/WTModManager.exe dist/SHA256SUMS.txt dist/build-info.json dist/sbom.cdx.json --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "WT Mod Manager $env:WTMM_VERSION - Verified Installer Beta" --notes-file release-notes.md --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publication failed" }
          $published = @(gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw "Unable to read back published release" }
          foreach ($file in @("WTModManager-Setup.exe", "WTModManager.exe", "SHA256SUMS.txt", "build-info.json", "sbom.cdx.json")) {
            if ($published -notcontains $file) { throw "Published release is missing $file" }
          }
          Write-Output "Verified all five release assets are present for $tag"
