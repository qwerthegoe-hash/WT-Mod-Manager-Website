name: Verify published WTMM release checksums (read-only)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-published:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify SHA256SUMS and immutable published binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [[ -z "$tag" ]]; then
            tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]] || { echo "Invalid release tag"; exit 1; }
          mkdir -p released
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir released \
            --pattern 'WTModManager.exe' --pattern 'WTModManager-Setup.exe' \
            --pattern 'SHA256SUMS.txt' --pattern 'build-info.json'
          test -f released/WTModManager.exe
          test -f released/WTModManager-Setup.exe
          if [[ ! -f released/SHA256SUMS.txt ]]; then
            echo "No SHA256SUMS.txt: legacy release requires manual audit"
            exit 1
          fi
          cd released
          sha256sum -c SHA256SUMS.txt
          # NEVER upload/overwrite the original publisher's manifest.
          echo "Published release $tag matches immutable checksums."
