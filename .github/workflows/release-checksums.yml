name: WTMM release artifact SHA-256 checksums

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  hash-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download published Windows release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir artifacts             --pattern '*.exe' --pattern '*.msi' --pattern '*.zip'
      - name: Generate and verify SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          shopt -s nullglob
          packages=( *.exe *.msi *.zip )
          if (( ${#packages[@]} == 0 )); then
            echo "No installer/archive assets; refusing to publish empty checksums" >&2
            exit 1
          fi
          sha256sum -- "${packages[@]}" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          test -s SHA256SUMS.txt
      - name: Publish checksum manifest to existing GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" artifacts/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
