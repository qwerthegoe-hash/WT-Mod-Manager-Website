name: Publish WT Mod Manager Windows Beta

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-windows-beta.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish reviewed Windows binary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify successful Windows build source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: "44359111821"
          BUILT_COMMIT: "54ef09a58ab77e6f80a0a6b6fe4e6bcfce3ce832"
        run: |
          set -euo pipefail
          actual_commit="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" --jq '.head_sha')"
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" --jq '.conclusion')"
          test "$actual_commit" = "$BUILT_COMMIT"
          test "$conclusion" = "success"

      - name: Download verified Windows build artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download 44359111821 --repo "$GITHUB_REPOSITORY" \
            --name WTModManager-Windows-2 --dir dist
          test -s dist/WTModManager.exe
          file -b dist/WTModManager.exe | grep -q 'PE32+'

      - name: Write SHA-256 checksum and release notes
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum WTModManager.exe > SHA256SUMS.txt)
          (cd dist && sha256sum --check SHA256SUMS.txt)
          cat > release-notes.md <<'NOTES'
          WT Mod Manager 1.2 - Public Beta for Windows x64

          This beta is a portable, standalone Windows executable for managing
          supported War Thunder customization files. No installer is required:
          download WTModManager.exe and run it directly.

          This is the first public beta and has not yet been tested on every
          Windows configuration. Please report issues via the project's
          official website. Settings and personal mod files are stored
          separately in the user's Windows profile.

          The SHA256SUMS.txt file contains the published executable checksum.
          WT Mod Manager is an independent fan project, not an official
          Gaijin Entertainment product.
          NOTES

      - name: Publish permanent public GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: "v1.2.0-beta.1"
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it."
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            dist/WTModManager.exe dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "WT Mod Manager 1.2 - Windows Public Beta" \
            --notes-file release-notes.md \
            --prerelease \
            --latest=false
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
